<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#11181D; --navy-panel:#161E24; --navy-line:#2B333C; --orange:#FEC62F; --off-white:#F2F0EB; --gray:#8891A0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{width:1080px; height:1080px; overflow:hidden; font-family:'Inter',sans-serif; background:var(--navy);}
  .post{position:relative; width:1080px; height:1080px; background:var(--navy); overflow:hidden;}

  .wm{position:absolute; z-index:0; color:var(--navy-panel); right:-70px; bottom:-70px; width:560px; height:560px;}
  .wm svg{width:100%; height:100%; display:block;}

  .content{position:relative; z-index:2; height:100%; display:flex; flex-direction:column; padding:64px 72px 60px;}

  .eyebrow{
    font-family:'Space Mono'; font-weight:700; font-size:21px; color:var(--navy);
    background:var(--orange); display:inline-flex; align-items:center; padding:9px 16px; letter-spacing:1.2px;
    text-transform:uppercase; width:fit-content; border-radius:3px;
  }

  .spacer{flex:1;}

  .icon-badge{
    width:84px; height:84px; border-radius:16px; background:var(--navy-panel); border:1px solid var(--navy-line);
    display:flex; align-items:center; justify-content:center; margin-bottom:30px;
  }
  .icon-badge svg{width:40px; height:40px; color:var(--orange);}

  .headline{
    font-family:'Anton'; color:var(--off-white); font-size:66px; letter-spacing:0.2px;
    line-height:1.05; margin-bottom:24px; max-width:880px;
  }
  .body{
    font-family:'Inter'; font-weight:500; color:var(--off-white); font-size:36px;
    line-height:1.42; letter-spacing:0.1px; max-width:860px;
  }
  .body strong{color:var(--orange); font-weight:800;}

  .footer{display:flex; align-items:center; justify-content:space-between; margin-top:44px; padding-top:28px; border-top:1px solid var(--navy-line);}
  .handle{font-family:'Space Mono'; font-size:22px; color:var(--off-white); font-weight:700; letter-spacing:0.3px;}
  .url{font-family:'Space Mono'; font-size:20px; color:var(--gray); letter-spacing:0.3px;}
</style>
</head>
<body>
<div class="post" id="post">
  <div class="wm" id="wm"></div>
  <div class="content" id="content"></div>
</div>

<script>
const POSTS = [
  // ŠPORT
  { group: "Šport", key: "moto", name: "Motošport",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/><line x1="12" y1="4" x2="12" y2="10"/><line x1="6" y1="16" x2="10" y2="13"/><line x1="18" y1="16" x2="14" y2="13"/></svg>',
    body: "Piloti F1 a WRC musia pri rýchlosti nad <strong>300 km/h</strong> vyhodnotiť situáciu v zlomkoch sekundy." },
  { group: "Šport", key: "futbal", name: "Futbal",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8.3l2.7 2-1 3.2h-3.4l-1-3.2z" fill="currentColor"/><path d="M12 3.5v2.7M6.3 7.3l2.2 1.7M17.7 7.3l-2.2 1.7M8.6 16.7l1-3.2M15.4 16.7l-1-3.2" stroke-width="1.3"/></svg>',
    body: "Štúdia J. Fauberta (2013) ukázala, že profesionálni futbalisti sa učia sledovať viacero objektov naraz rýchlejšie než bežná populácia. Podobne trénovala aj olympijská brankárka <strong>Erin McLeod</strong>." },
  { group: "Šport", key: "basketbal", name: "Basketbal (NBA)",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="3" x2="12" y2="21"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M5.5 5.5C8 8.5 8 15.5 5.5 18.5"/><path d="M18.5 5.5C16 8.5 16 15.5 18.5 18.5"/></svg>',
    body: "So zrakovým tréningom experimentovali <strong>Stephen Curry</strong> a Kawhi Leonard. Kluby v NBA, napríklad Toronto Raptors, naň bežne používajú NeuroTracker." },
  { group: "Šport", key: "nfl", name: "Americký futbal (NFL)",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12c0-3.5 4-7.5 8-7.5s8 4 8 7.5-4 7.5-8 7.5-8-4-8-7.5z"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="9.5" y1="10" x2="9.5" y2="14"/><line x1="12" y1="9.3" x2="12" y2="14.7"/><line x1="14.5" y1="10" x2="14.5" y2="14"/></svg>',
    body: "Bývalý MVP <strong>Matt Ryan</strong> trénuje s nástrojom NeuroTracker celoročne. Tímy v NFL bežne testujú hráčov aj na zariadeniach typu Dynavision." },
  { group: "Šport", key: "hokej", name: "Hokej",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 2.5L9 15.5"/><path d="M9 15.5c-.6 1.3-1.7 2.2-3.2 2.2H4.5"/><ellipse cx="4.2" cy="19.2" rx="2.3" ry="1.1" fill="currentColor" stroke="none"/></svg>',
    body: "<strong>Connor McDavid</strong> roky trénuje periférne videnie a reakciu — podľa jeho agenta mu to dáva kľúčovú výhodu na ľade. Podobne trénovali aj Sidney Crosby a Tom Wilson." },
  { group: "Šport", key: "combat", name: "Bojové športy a šerm",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="5" y1="20" x2="19" y2="4"/><line x1="19" y1="20" x2="5" y2="4"/><line x1="8" y1="16.5" x2="10.5" y2="18.3"/><line x1="16" y1="16.5" x2="13.5" y2="18.3"/><circle cx="5" cy="20" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="20" r="1" fill="currentColor" stroke="none"/></svg>',
    body: "Rozlíšenie skutočného útoku od finty súpera padá v <strong>desiatkach milisekúnd</strong> — presne to, čo meria kognitívna kontrola." },

  // ZDRAVIE
  { group: "Zdravie", key: "chirurgia", name: "Chirurgia",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="7" x2="12" y2="17"/><line x1="7" y1="12" x2="17" y2="12"/></svg>',
    body: "Výskum (Grantcharov a kol.) ukázal, že <strong>vizuopriestorová schopnosť</strong> predikuje výkon v laparoskopickej chirurgii." },
  { group: "Zdravie", key: "adhd", name: "ADHD",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg>',
    body: "<strong>EndeavorRx</strong> — videohra na zlepšenie pozornosti u detí s ADHD — v roku 2020 získala ako prvá svojho druhu schválenie od americkej FDA." },
  { group: "Zdravie", key: "demencia", name: "Prevencia demencie",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
    body: "Štúdia ACTIVE (Edwards a kol.) ukázala, že tréning rýchlosti spracovania — princíp UFOV — znížil riziko demencie za 10 rokov <strong>takmer o polovicu</strong>." },
  { group: "Zdravie", key: "rekonvalescencia", name: "Rekonvalescencia po úraze",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',
    body: "Okulomotorické cvičenia — sledovanie, sakády, plynulé sledovanie — sú štandardnou súčasťou <strong>rehabilitácie po otrase mozgu</strong> v športe." },

  // OSTATNÉ
  { group: "V praxi", key: "esports", name: "Esports",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="8" width="18" height="9" rx="4"/><circle cx="8" cy="12.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="12.5" r="1.3" fill="currentColor" stroke="none"/></svg>',
    body: "Profesionálni hráči dosahujú reakčné časy okolo <strong>150–200 ms</strong>, hlboko pod bežným priemerom populácie." },
  { group: "V praxi", key: "letectvo", name: "Letectvo",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 21 4 13 21 11 13 3 12z"/></svg>',
    body: "Výber aj výcvik pilotov bežne zahŕňa testy typu <strong>Useful Field of View</strong> — situačné povedomie je tu otázkou bezpečnosti." },
  { group: "V praxi", key: "cesta", name: "Bezpečnosť cestnej premávky",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/><line x1="12" y1="4" x2="12" y2="10"/><line x1="6" y1="16" x2="10" y2="13"/><line x1="18" y1="16" x2="14" y2="13"/></svg>',
    body: "UFOV patrí medzi <strong>najsilnejšie prediktory rizika nehody</strong> — v USA je súčasťou hodnotenia spôsobilosti viesť vozidlo u starších vodičov." },
  { group: "V praxi", key: "hry", name: "Herný výskum",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><line x1="8" y1="20" x2="16" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/></svg>',
    body: "Klasická štúdia Green &amp; Bavelier (2003) ukázala, že hráči akčných videohier majú <strong>rozšírené zorné pole</strong> a rýchlejšie spracovanie vizuálnych podnetov." }
];

function render(i){
  const p = POSTS[i];
  document.getElementById('wm').innerHTML = p.icon;
  const body = `
    <span class="eyebrow">${p.group}</span>
    <div class="spacer"></div>
    <div class="icon-badge">${p.icon}</div>
    <div class="headline">${p.name}</div>
    <div class="body">${p.body}</div>
    <div class="footer">
      <span class="handle">@the.focus.place</span>
      <span class="url">FOCUSPLACE.SITE</span>
    </div>`;
  document.getElementById('content').innerHTML = body;
}

const params = new URLSearchParams(location.search);
const i = parseInt(params.get('i') || '0', 10);
render(i);
window.TOTAL_POSTS = POSTS.length;
</script>
</body>
</html>
