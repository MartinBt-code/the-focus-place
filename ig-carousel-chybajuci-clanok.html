<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#11181D; --navy-line:#2B333C; --orange:#FEC62F; --off-white:#F2F0EB; --gray:#8891A0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{width:1080px; height:1080px; overflow:hidden; font-family:'Inter',sans-serif; background:var(--navy);}
  .post{position:relative; width:1080px; height:1080px; background:var(--navy); overflow:hidden;}

  .bg{position:absolute; inset:0; z-index:0;}
  .bg img{width:100%; height:100%; object-fit:cover; filter:grayscale(0.35) brightness(0.42) contrast(1.15);}
  .bg::after{content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(17,24,29,0.4) 0%, rgba(17,24,29,0.58) 34%, rgba(17,24,29,0.95) 74%, #11181D 100%);
  }
  .bg.cover-type::after{
    background:linear-gradient(180deg, rgba(17,24,29,0.48) 0%, rgba(17,24,29,0.62) 42%, rgba(17,24,29,0.96) 80%, #11181D 100%);
  }
  .bg.cta-type::after{
    background:linear-gradient(180deg, rgba(17,24,29,0.55) 0%, rgba(17,24,29,0.85) 45%, #11181D 82%, #11181D 100%);
  }

  .content{position:relative; z-index:2; height:100%; display:flex; flex-direction:column; padding:60px 68px 56px;}

  .top-bar{display:flex; align-items:center; justify-content:space-between;}
  .eyebrow{
    font-family:'Space Mono'; font-weight:700; font-size:20px; color:var(--navy);
    background:var(--orange); display:inline-flex; align-items:center; gap:8px; padding:9px 16px 9px 14px; letter-spacing:1.2px;
    text-transform:uppercase; width:fit-content; border-radius:3px;
  }
  .counter{font-family:'Space Mono'; font-weight:700; font-size:22px; color:var(--off-white); letter-spacing:1px;}
  .counter span{color:var(--gray);}

  .spacer{flex:1;}

  .fact-label{
    font-family:'Anton'; color:var(--orange); font-size:33px; letter-spacing:0.3px;
    line-height:1.15; margin-bottom:18px; text-transform:uppercase;
  }
  .fact-body{
    font-family:'Inter'; font-weight:500; color:var(--off-white); font-size:39px;
    line-height:1.38; letter-spacing:0.1px;
  }
  .fact-body strong{color:var(--orange); font-weight:800;}

  .cover-cat{font-family:'Anton'; color:var(--orange); font-size:78px; line-height:1.06; letter-spacing:0.2px; margin-bottom:20px;}
  .cover-hook{font-family:'Inter'; font-weight:600; color:var(--gray); font-size:34px; line-height:1.4; max-width:900px;}
  .swipe-hint{
    font-family:'Space Mono'; font-weight:700; color:var(--off-white); font-size:22px;
    letter-spacing:1px; display:flex; align-items:center; gap:10px; margin-top:34px;
  }

  .cta-wrap{display:flex; flex-direction:column; align-items:flex-start;}
  .cta-eyebrow{font-family:'Space Mono'; font-weight:700; font-size:22px; color:var(--orange); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:20px;}
  .cta-headline{font-family:'Anton'; color:var(--off-white); font-size:68px; line-height:1.1; margin-bottom:26px; max-width:900px;}
  .cta-body{font-family:'Inter'; font-weight:500; color:var(--gray); font-size:33px; line-height:1.45; max-width:820px; margin-bottom:8px;}
  .cta-btn{
    margin-top:32px; font-family:'Space Mono'; font-weight:700; font-size:26px; color:var(--navy);
    background:var(--orange); padding:20px 34px; border-radius:6px; letter-spacing:0.5px; width:fit-content;
    display:flex; align-items:center; gap:12px;
  }

  .footer{display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:36px;}
  .handle{font-family:'Space Mono'; font-size:22px; color:var(--off-white); font-weight:700; letter-spacing:0.3px;}
  .url{font-family:'Space Mono'; font-size:20px; color:var(--gray); letter-spacing:0.3px;}
  .dots{display:flex; gap:8px; flex-wrap:wrap; max-width:340px; justify-content:flex-end;}
  .dots .dot{width:8px; height:8px; border-radius:50%; background:var(--navy-line);}
  .dots .dot.active{background:var(--orange); width:22px; border-radius:5px;}
</style>
</head>
<body>
<div class="post" id="post">
  <div class="bg" id="bg"><img id="bgImg" src="" alt=""></div>
  <div class="content" id="content"></div>
</div>

<script>
const FACTS = [
  {
    bg: "assets/athlete-rojik.jpg",
    label: "Hickov zákon (1952)",
    body: "Čím viac možností máš na výber, tým dlhšie trvá rozhodnutie. V športe nevyhráva najrýchlejšia reakcia, ale <strong>najsprávnejšie vyhodnotenie situácie</strong>."
  },
  {
    bg: "assets/carousel/bg-rovinj-daytime.jpg",
    label: "Športovci sa učia rýchlejšie",
    body: "Štúdia J. Fauberta (2013) porovnala profesionálnych športovcov s bežnou populáciou — <strong>športovci sa učili sledovať viacero pohybujúcich sa objektov naraz</strong> výrazne rýchlejšie."
  },
  {
    bg: "assets/athlete-duduc.jpg",
    label: "„Quiet eye“",
    body: "Výskum Joan Vickersovej (1996) ukázal, že elitní športovci pred kľúčovým pohybom — streľbou, hodom, prihrávkou — fixujú zrak na cieľ <strong>výrazne dlhšie</strong> než priemerní hráči."
  },
  {
    bg: "assets/carousel/bg-koordinacia.jpg",
    label: "NBA aj NFL to berú vážne",
    body: "Kluby v NBA (napríklad Toronto Raptors) aj tímy v NFL zaraďujú do prípravy nástroje na tréning <strong>periférneho videnia a rýchleho rozhodovania</strong>."
  },
  {
    bg: "assets/carousel/bg-vizualne-vnimanie.jpg",
    label: "Zorné pole je menšie, než si myslíš",
    body: "Useful Field of View (UFOV) — oblasť, z ktorej dokážeš naraz spracovať informáciu — je <strong>jedným z najsilnejších prediktorov výkonu</strong> v rýchlom športe."
  },
  {
    bg: "assets/carousel/bg-kognitivna.jpg",
    label: "Aj hráči videohier majú výhodu",
    body: "Klasická štúdia Green &amp; Bavelier (2003) ukázala, že hráči akčných videohier majú <strong>rozšírené zorné pole</strong> a rýchlejšie spracovanie vizuálnych podnetov než nehráči."
  },
  {
    bg: "assets/carousel/bg-vizualne-sledovanie.jpg",
    label: "Čísla, ktoré rozhodujú",
    body: "Bežný dospelý reaguje v priemere za 250&nbsp;ms. Profesionálni esports hráči za <strong>150–180&nbsp;ms</strong>. Olympijskí šprintéri na štarte za 120–160&nbsp;ms."
  }
];

const SLIDES = [
  { type: "cover" },
  ...FACTS.map(f => ({ type: "fact", f })),
  { type: "cta" }
];
const TOTAL = SLIDES.length;

function dotsHtml(n){
  let h = '<div class="dots">';
  for (let i=0;i<TOTAL;i++) h += `<div class="dot${i===n?' active':''}"></div>`;
  h += '</div>';
  return h;
}

function render(i){
  const s = SLIDES[i];
  const eyebrow = `<span class="eyebrow">Vizuálny tréning</span>`;
  const counter = `<span class="counter">${i+1}<span>/${TOTAL}</span></span>`;

  let bgSrc = "assets/carousel/bg-pamat.jpg";
  let bgClass = "";
  if (s.type === "cover") bgClass = "cover-type";
  if (s.type === "cta") { bgClass = "cta-type"; bgSrc = "assets/carousel/bg-reakcny.jpg"; }
  if (s.type === "fact") bgSrc = s.f.bg;

  document.getElementById('bgImg').src = bgSrc;
  document.getElementById('bg').className = 'bg ' + bgClass;

  let body = '';
  if (s.type === 'cover') {
    body = `
      <div class="top-bar">${eyebrow}${counter}</div>
      <div class="spacer"></div>
      <div class="cover-cat">Chýbajúci článok<br>v tvojej športovej<br>príprave.</div>
      <div class="cover-hook">Rýchlosť reakcie, sledovanie viacerých objektov, periférne videnie — presne to, čo rozhoduje v zlomkoch sekundy.</div>
      <div class="swipe-hint">Prečo na tom záleží →</div>
      <div class="footer">
        <span class="handle">@the.focus.place</span>
        ${dotsHtml(i)}
      </div>`;
  } else if (s.type === 'fact') {
    body = `
      <div class="top-bar">${eyebrow}${counter}</div>
      <div class="spacer"></div>
      <div class="fact-label">${s.f.label}</div>
      <div class="fact-body">${s.f.body}</div>
      <div class="footer">
        <span class="handle">@the.focus.place</span>
        ${dotsHtml(i)}
      </div>`;
  } else {
    body = `
      <div class="top-bar">${eyebrow}${counter}</div>
      <div class="spacer"></div>
      <div class="cta-wrap">
        <div class="cta-eyebrow">Otestuj sa</div>
        <div class="cta-headline">Vizuálny systém sa dá trénovať.<br>Zisti, ako si na tom ty.</div>
        <div class="cta-body">20+ live testov reakčného času, koordinácie, pozornosti a sledovania — zadarmo, priamo v prehliadači.</div>
        <div class="cta-btn">Skús na focusplace.site →</div>
      </div>
      <div class="footer">
        <span class="url">FOCUSPLACE.SITE</span>
        ${dotsHtml(i)}
      </div>`;
  }
  document.getElementById('content').innerHTML = body;
}

const params = new URLSearchParams(location.search);
const i = parseInt(params.get('i') || '0', 10);
render(i);
window.TOTAL_SLIDES = TOTAL;
</script>
</body>
</html>
