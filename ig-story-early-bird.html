<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#11181D; --navy-line:#2B333C; --orange:#FEC62F; --off-white:#F2F0EB; --gray:#8891A0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{width:1080px; height:1920px; overflow:hidden; font-family:'Inter',sans-serif; background:var(--navy);}
  .story{position:relative; width:1080px; height:1920px; background:var(--navy); overflow:hidden;}

  .bg{position:absolute; inset:0; z-index:0; overflow:hidden;}
  .bg img{
    width:100%; height:100%; object-fit:cover; object-position:62% 38%;
    filter:grayscale(0.25) brightness(0.9) contrast(1.08);
  }
  .bg .fade{
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(17,24,29,0.97) 0%, rgba(17,24,29,0.62) 17%, rgba(17,24,29,0.15) 34%, rgba(17,24,29,0.25) 62%, rgba(17,24,29,0.92) 82%, var(--navy) 100%);
  }

  .content{position:relative; z-index:2; height:100%; display:flex; flex-direction:column; padding:0 72px;}

  .top-bar{padding-top:160px; display:flex; align-items:center; gap:14px;}
  .dot{width:12px; height:12px; border-radius:50%; background:#E8543C; box-shadow:0 0 0 4px rgba(232,84,60,0.25);}
  .eyebrow{
    font-family:'Space Mono'; font-weight:700; font-size:26px; color:var(--off-white);
    letter-spacing:2px; text-transform:uppercase;
  }

  h1{
    font-family:'Anton'; color:var(--off-white); font-size:98px;
    line-height:1.04; margin-top:44px; letter-spacing:0.5px;
  }
  h1 em{font-style:normal; color:var(--navy); background:var(--orange); padding:2px 14px; display:inline;}

  .top-spacer{flex:0.62;}

  .price-block{
    display:flex; align-items:baseline; gap:24px; margin-top:6px;
  }
  .price-now{font-family:'Anton'; font-size:150px; color:var(--orange); line-height:1;}
  .price-later{display:flex; flex-direction:column; gap:2px;}
  .price-later .was{font-family:'Space Mono'; font-size:34px; color:var(--gray); text-decoration:line-through; text-decoration-color:#E8543C; text-decoration-thickness:3px;}
  .price-later .tmrw{font-family:'Space Mono'; font-size:22px; color:var(--gray); letter-spacing:0.5px; text-transform:uppercase;}

  .divider{width:100%; height:2px; background:var(--navy-line); margin:38px 0 32px;}

  .ws-info h3{font-family:'Inter'; font-weight:700; font-size:38px; color:var(--off-white); line-height:1.25; margin-bottom:10px;}
  .ws-meta{font-family:'Space Mono'; font-size:26px; color:var(--gray); letter-spacing:0.3px;}
  .ws-meta strong{color:var(--off-white); font-weight:700;}

  .bottom-spacer{flex:1;}

  .cta{
    display:flex; align-items:center; justify-content:center; gap:14px;
    background:var(--orange); color:var(--navy); font-family:'Space Mono'; font-weight:700;
    font-size:34px; letter-spacing:0.5px; text-transform:uppercase;
    padding:32px; width:100%; border-radius:6px;
  }

  .footer{
    display:flex; align-items:center; justify-content:space-between;
    padding:36px 0 110px;
  }
  .footer img{height:46px; width:auto;}
  .footer .url{font-family:'Space Mono'; font-size:24px; color:var(--gray); font-weight:700; letter-spacing:0.5px;}
</style>
</head>
<body>
<div class="story">
  <div class="bg">
    <img src="assets/workshop/martin-3.webp" alt="">
    <div class="fade"></div>
  </div>
  <div class="content">
    <div class="top-bar">
      <span class="dot"></span>
      <span class="eyebrow">Posledná šanca</span>
    </div>
    <h1>POSLEDNÝ<br>DEŇ ZA <em>ZĽAVU</em></h1>

    <div class="top-spacer"></div>

    <div class="price-block">
      <div class="price-now">89&nbsp;€</div>
      <div class="price-later">
        <span class="was">99 €</span>
        <span class="tmrw">od zajtra</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="ws-info">
      <h3>Workshop: Vizuálny<br>a kognitívny tréning</h3>
      <div class="ws-meta"><strong>3. 10. 2026</strong> · Košice</div>
    </div>

    <div class="bottom-spacer"></div>

    <div class="cta">Prihlás sa a zaplať →</div>
    <div class="footer">
      <img src="assets/thePlace_logo_white.png" alt="the Focus Place">
      <span class="url">FOCUSPLACE.SITE/WORKSHOP</span>
    </div>
  </div>
</div>
</body>
</html>
