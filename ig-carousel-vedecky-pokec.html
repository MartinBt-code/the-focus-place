<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#11181D; --navy-line:#2B333C; --orange:#FEC62F; --off-white:#F2F0EB; --gray:#8891A0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{width:1080px; height:1080px; overflow:hidden; font-family:'Inter',sans-serif; background:var(--navy);}
  .post{position:relative; width:1080px; height:1080px; background:var(--navy); overflow:hidden;}

  .bg{position:absolute; inset:0; z-index:0;}
  .bg img{width:100%; height:100%; object-fit:cover; filter:grayscale(0.35) brightness(0.42) contrast(1.15);}
  .bg::after{content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(17,24,29,0.35) 0%, rgba(17,24,29,0.55) 32%, rgba(17,24,29,0.94) 68%, #11181D 100%);
  }
  .bg.cover-type::after{
    background:linear-gradient(180deg, rgba(17,24,29,0.45) 0%, rgba(17,24,29,0.6) 40%, rgba(17,24,29,0.95) 78%, #11181D 100%);
  }
  .bg.cta-type::after{
    background:linear-gradient(180deg, rgba(17,24,29,0.55) 0%, rgba(17,24,29,0.85) 45%, #11181D 82%, #11181D 100%);
  }

  .content{position:relative; z-index:2; height:100%; display:flex; flex-direction:column; padding:60px 68px 56px;}

  .top-bar{display:flex; align-items:center; justify-content:space-between;}
  .eyebrow{
    font-family:'Space Mono'; font-weight:700; font-size:21px; color:var(--navy);
    background:var(--orange); display:inline-flex; align-items:center; gap:8px; padding:9px 16px 9px 14px; letter-spacing:1.2px;
    text-transform:uppercase; width:fit-content; border-radius:3px;
  }
  .eyebrow svg{width:16px; height:16px; flex-shrink:0;}
  .counter{font-family:'Space Mono'; font-weight:700; font-size:22px; color:var(--off-white); letter-spacing:1px;}
  .counter span{color:var(--gray);}

  .spacer{flex:1;}
  .spacer-small{flex:0.35;}

  /* ---- fact slide ---- */
  .fact-label{
    font-family:'Anton'; color:var(--orange); font-size:34px; letter-spacing:0.3px;
    line-height:1.15; margin-bottom:18px; text-transform:uppercase;
  }
  .fact-body{
    font-family:'Inter'; font-weight:500; color:var(--off-white); font-size:40px;
    line-height:1.38; letter-spacing:0.1px;
  }
  .fact-body strong{color:var(--orange); font-weight:800;}

  /* ---- cover slide ---- */
  .cover-cat{font-family:'Anton'; color:var(--off-white); font-size:88px; line-height:1.02; letter-spacing:0.2px; margin-bottom:20px;}
  .cover-hook{font-family:'Inter'; font-weight:600; color:var(--gray); font-size:36px; line-height:1.35; max-width:880px;}
  .cover-hook strong{color:var(--orange); font-weight:700;}
  .swipe-hint{
    font-family:'Space Mono'; font-weight:700; color:var(--off-white); font-size:22px;
    letter-spacing:1px; display:flex; align-items:center; gap:10px; margin-top:34px;
  }

  /* ---- cta slide ---- */
  .cta-wrap{display:flex; flex-direction:column; align-items:flex-start;}
  .cta-eyebrow{font-family:'Space Mono'; font-weight:700; font-size:22px; color:var(--orange); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:20px;}
  .cta-headline{font-family:'Anton'; color:var(--off-white); font-size:74px; line-height:1.08; margin-bottom:26px;}
  .cta-body{font-family:'Inter'; font-weight:500; color:var(--gray); font-size:34px; line-height:1.45; max-width:820px; margin-bottom:8px;}
  .cta-btn{
    margin-top:32px; font-family:'Space Mono'; font-weight:700; font-size:26px; color:var(--navy);
    background:var(--orange); padding:20px 34px; border-radius:6px; letter-spacing:0.5px; width:fit-content;
    display:flex; align-items:center; gap:12px;
  }

  /* ---- footer / dots ---- */
  .footer{display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:36px;}
  .handle{font-family:'Space Mono'; font-size:22px; color:var(--off-white); font-weight:700; letter-spacing:0.3px;}
  .url{font-family:'Space Mono'; font-size:20px; color:var(--gray); letter-spacing:0.3px;}
  .dots{display:flex; gap:10px;}
  .dots .dot{width:9px; height:9px; border-radius:50%; background:var(--navy-line);}
  .dots .dot.active{background:var(--orange); width:26px; border-radius:5px;}
</style>
</head>
<body>
<div class="post" id="post">
  <div class="bg" id="bg"><img id="bgImg" src="" alt=""></div>
  <div class="content" id="content"></div>
</div>

<script>
const ICONS = {
  reakcny: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>',
  pamat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3C7.3 3 6 4.3 6 6c0 .3 0 .6.1.9C4.8 7.4 4 8.6 4 10c0 1 .4 1.9 1 2.6-.6.6-1 1.5-1 2.4 0 1.7 1.3 3 3 3 .3 0 .6 0 .9-.1.5 1.2 1.7 2.1 3.1 2.1V3z"/><path d="M15 3c1.7 0 3 1.3 3 3 0 .3 0 .6-.1.9 1.3.5 2.1 1.7 2.1 3.1 0 1-.4 1.9-1 2.6.6.6 1 1.5 1 2.4 0 1.7-1.3 3-3 3-.3 0-.6 0-.9-.1-.5 1.2-1.7 2.1-3.1 2.1V3z"/></svg>',
  kognitivna: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg>',
  koordinacia: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/></svg>',
  "vizualne-vnimanie": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>',
  "vizualne-sledovanie": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8" stroke-dasharray="2 3"/><circle cx="12" cy="4" r="1.6" fill="currentColor" stroke="none"/></svg>'
};

const CATEGORIES = [
  {
    key: "reakcny", name: "Reakčný čas", bg: "assets/carousel/bg-reakcny.jpg", count: 3,
    hook: "Prečo najrýchlejší nie je vždy ten, kto vyhráva.",
    facts: [
      { label: "Meriame to už 150 rokov", body: "Reakčný čas patrí medzi <strong>najstaršie merateľné veličiny</strong> v experimentálnej psychológii — prvé merania siahajú do 19. storočia." },
      { label: "Hickov zákon (1952)", body: "Čím viac možností máš na výber, tým <strong>dlhšie trvá rozhodnutie</strong>. Mozog musí najprv vybrať, ktorá reakcia je správna." },
      { label: "Nejde o rýchlosť. Ide o výber.", body: "V športe nevyhráva najrýchlejší na jeden signál — vyhráva ten, kto sa <strong>najrýchlejšie a najsprávnejšie</strong> rozhodne spomedzi viacerých možností." }
    ]
  },
  {
    key: "pamat", name: "Pamäť", bg: "assets/carousel/bg-pamat.jpg", count: 4,
    hook: "Koľko vecí naozaj udržíš v hlave naraz?",
    facts: [
      { label: "7±2... alebo skôr 4", body: "Klasická štúdia <strong>Georgea Millera</strong> (1956) odhadla kapacitu pracovnej pamäte na 7±2 položiek. Novší výskum ju kladie skôr okolo 4." },
      { label: "Priestorová pamäť má vlastnú sieť", body: "Iný mozgový okruh okolo <strong>hipokampu</strong> rieši, KDE sa niečo nachádza — polohy spoluhráčov, prekážok, trajektórií." },
      { label: "Tlak trénuje lepšie než opakovanie", body: "Zapamätanie si pod <strong>časovým tlakom</strong>, nie pasívne opakovanie, je to, čo najlepšie prenáša zlepšenie aj mimo testu." }
    ]
  },
  {
    key: "kognitivna", name: "Kognitívna kontrola", bg: "assets/carousel/bg-kognitivna.jpg", count: 4,
    hook: "3 schopnosti, ktoré rozhodujú v zlomku sekundy.",
    facts: [
      { label: "Model troch zložiek (Miyake, 2000)", body: "<strong>Inhibícia</strong>, aktualizácia pracovnej pamäte a prepínanie pravidiel — presne tieto tri riadia, ako zvládaš rušivé podnety." },
      { label: "Stroopov test (1935)", body: "Mozog musí <strong>potlačiť rýchlejšie čítanie</strong> slova v prospech pomenovania farby. Klasický test inhibície." },
      { label: "Klamlivý pohyb súpera?", body: "Presne tieto tri schopnosti rozhodujú, keď musíš v <strong>zlomku sekundy potlačiť fintu</strong> a zareagovať na skutočný pohyb." }
    ]
  },
  {
    key: "koordinacia", name: "Koordinácia", bg: "assets/carousel/bg-koordinacia.jpg", count: 4,
    hook: "Rovnica, ktorá platí od dotykových displejov po šport.",
    facts: [
      { label: "Fittsov zákon (1954)", body: "Čím menší a vzdialenejší cieľ, tým <strong>dlhšie trvá presný zásah</strong>. Používa sa pri návrhu športových trenažérov aj dotykových rozhraní." },
      { label: "Nie je to jedna schopnosť", body: "Koordinácia ruky a oka je súhra <strong>vizuálneho spracovania, rozhodovania a motoriky</strong> naraz — dá sa trénovať oddelene od reakčnej rýchlosti." },
      { label: "Cvičenie staré desaťročia", body: "Koncentračná mriežka je klasika <strong>športovej psychológie</strong> používaná na tréning sústredenej pozornosti pod tlakom." }
    ]
  },
  {
    key: "vizualne-vnimanie", name: "Vizuálne vnímanie", bg: "assets/carousel/bg-vizualne-vnimanie.jpg", count: 3,
    hook: "Tvoje zorné pole je menšie, než si myslíš.",
    facts: [
      { label: "Useful Field of View", body: "Oblasť, z ktorej dokážeš naraz spracovať informáciu, je prekvapivo malá — jeden z <strong>najsilnejších prediktorov výkonu</strong> v rýchlom športe." },
      { label: "Periférne vs. centrálne videnie", body: "Mozog ich spracováva <strong>čiastočne oddelene</strong> — dá sa to teda trénovať samostatne, cielene." },
      { label: "Prečo skúsení športovci „vidia“ hru lepšie", body: "Citlivosť na kontrast klesá pri zlej viditeľnosti <strong>rýchlejšie než ostrosť videnia</strong>." }
    ]
  },
  {
    key: "vizualne-sledovanie", name: "Vizuálne sledovanie", bg: "assets/carousel/bg-vizualne-sledovanie.jpg", count: 3,
    hook: "Koľko pohybujúcich sa cieľov dokážeš sledovať naraz?",
    facts: [
      { label: "Plynulé sledovanie (smooth pursuit)", body: "Jediný typ pohybu očí, ktorý <strong>nedokážeme vedome vyvolať</strong> bez toho, aby sme mali reálne niečo, čo sledujeme." },
      { label: "Keď cieľ na chvíľu zmizne", body: "Mozog musí odhadnúť ďalšiu trajektóriu — <strong>coincidence-anticipation timing</strong>, kľúčové pri chytaní aj blokovaní." },
      { label: "3–4 objekty naraz (Pylyshyn &amp; Storm, 1988)", body: "Presne toľko, koľko potrebuje hráč kolektívneho športu <strong>sledovať spoluhráčov a súperov</strong> naraz." }
    ]
  }
];

// Build flat slide list: cover, fact1, fact2, fact3, cta — 5 per category
const SLIDES = [];
CATEGORIES.forEach(cat => {
  SLIDES.push({ type: "cover", cat });
  cat.facts.forEach(f => SLIDES.push({ type: "fact", cat, fact: f }));
  SLIDES.push({ type: "cta", cat });
});

function dotsHtml(n){
  let h = '<div class="dots">';
  for (let i=0;i<5;i++) h += `<div class="dot${i===n?' active':''}"></div>`;
  h += '</div>';
  return h;
}

function render(i){
  const s = SLIDES[i];
  const cat = s.cat;
  document.getElementById('bgImg').src = cat.bg;
  const bgEl = document.getElementById('bg');
  bgEl.className = 'bg' + (s.type === 'cover' ? ' cover-type' : s.type === 'cta' ? ' cta-type' : '');

  const idxInCat = SLIDES.filter((sl,j)=>sl.cat===cat && j<=i).length;
  const eyebrow = `<span class="eyebrow">${ICONS[cat.key]}${cat.name}</span>`;
  const counter = `<span class="counter">${idxInCat}<span>/5</span></span>`;

  let body = '';
  if (s.type === 'cover') {
    body = `
      <div class="top-bar">${eyebrow}${counter}</div>
      <div class="spacer"></div>
      <div class="cover-cat">${cat.name}</div>
      <div class="cover-hook">${cat.hook}</div>
      <div class="swipe-hint">Vedecký pokec →</div>
      <div class="footer">
        <span class="handle">@the.focus.place</span>
        ${dotsHtml(idxInCat-1)}
      </div>`;
  } else if (s.type === 'fact') {
    body = `
      <div class="top-bar">${eyebrow}${counter}</div>
      <div class="spacer"></div>
      <div class="fact-label">${s.fact.label}</div>
      <div class="fact-body">${s.fact.body}</div>
      <div class="footer">
        <span class="handle">@the.focus.place</span>
        ${dotsHtml(idxInCat-1)}
      </div>`;
  } else {
    body = `
      <div class="top-bar">${eyebrow}${counter}</div>
      <div class="spacer"></div>
      <div class="cta-wrap">
        <div class="cta-eyebrow">Otestuj sa</div>
        <div class="cta-headline">Toto všetko si vieš<br>zmerať za pár minút.</div>
        <div class="cta-body">${cat.count} live testov na <strong style="color:var(--off-white)">${cat.name.toLowerCase()}</strong> — zadarmo, priamo v prehliadači, bez registrácie.</div>
        <div class="cta-btn">Skús na focusplace.site →</div>
      </div>
      <div class="footer">
        <span class="url">FOCUSPLACE.SITE</span>
        ${dotsHtml(idxInCat-1)}
      </div>`;
  }
  document.getElementById('content').innerHTML = body;
}

const params = new URLSearchParams(location.search);
const i = parseInt(params.get('i') || '0', 10);
render(i);
window.TOTAL_SLIDES = SLIDES.length;
</script>
</body>
</html>
