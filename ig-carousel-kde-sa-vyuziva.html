<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#11181D; --navy-panel:#161E24; --navy-line:#2B333C; --orange:#FEC62F; --off-white:#F2F0EB; --gray:#8891A0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{width:1080px; height:1080px; overflow:hidden; font-family:'Inter',sans-serif; background:var(--navy);}
  .post{position:relative; width:1080px; height:1080px; background:var(--navy); overflow:hidden;}

  /* icon-watermark (no-photo) slides */
  .wm{position:absolute; z-index:0; color:var(--navy-panel); opacity:1;}
  .wm svg{width:100%; height:100%; display:block;}

  /* photo bg (cover only) */
  .bg{position:absolute; inset:0; z-index:0;}
  .bg img{width:100%; height:100%; object-fit:cover; filter:grayscale(0.35) brightness(0.42) contrast(1.15);}
  .bg::after{content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(17,24,29,0.45) 0%, rgba(17,24,29,0.6) 40%, rgba(17,24,29,0.95) 78%, #11181D 100%);
  }

  .content{position:relative; z-index:2; height:100%; display:flex; flex-direction:column; padding:60px 68px 56px;}

  .top-bar{display:flex; align-items:center; justify-content:space-between;}
  .eyebrow{
    font-family:'Space Mono'; font-weight:700; font-size:21px; color:var(--navy);
    background:var(--orange); display:inline-flex; align-items:center; gap:8px; padding:9px 16px 9px 14px; letter-spacing:1.2px;
    text-transform:uppercase; width:fit-content; border-radius:3px;
  }
  .counter{font-family:'Space Mono'; font-weight:700; font-size:22px; color:var(--off-white); letter-spacing:1px;}
  .counter span{color:var(--gray);}

  .spacer{flex:1;}

  /* icon badge on fact slides */
  .icon-badge{
    width:76px; height:76px; border-radius:14px; background:var(--navy-panel); border:1px solid var(--navy-line);
    display:flex; align-items:center; justify-content:center; margin-bottom:28px;
  }
  .icon-badge svg{width:36px; height:36px; color:var(--orange);}

  .fact-label{
    font-family:'Anton'; color:var(--off-white); font-size:56px; letter-spacing:0.2px;
    line-height:1.08; margin-bottom:20px;
  }
  .fact-body{
    font-family:'Inter'; font-weight:500; color:var(--gray); font-size:37px;
    line-height:1.42; letter-spacing:0.1px; max-width:900px;
  }
  .fact-body strong{color:var(--off-white); font-weight:700;}

  /* cover slide */
  .cover-cat{font-family:'Anton'; color:var(--off-white); font-size:80px; line-height:1.05; letter-spacing:0.2px; margin-bottom:20px; max-width:920px;}
  .cover-hook{font-family:'Inter'; font-weight:600; color:var(--gray); font-size:34px; line-height:1.4; max-width:860px;}
  .swipe-hint{
    font-family:'Space Mono'; font-weight:700; color:var(--off-white); font-size:22px;
    letter-spacing:1px; display:flex; align-items:center; gap:10px; margin-top:34px;
  }

  /* cta slide */
  .cta-wrap{display:flex; flex-direction:column; align-items:flex-start;}
  .cta-eyebrow{font-family:'Space Mono'; font-weight:700; font-size:22px; color:var(--orange); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:20px;}
  .cta-headline{font-family:'Anton'; color:var(--off-white); font-size:70px; line-height:1.1; margin-bottom:26px; max-width:900px;}
  .cta-body{font-family:'Inter'; font-weight:500; color:var(--gray); font-size:34px; line-height:1.45; max-width:820px; margin-bottom:8px;}
  .cta-btn{
    margin-top:32px; font-family:'Space Mono'; font-weight:700; font-size:26px; color:var(--navy);
    background:var(--orange); padding:20px 34px; border-radius:6px; letter-spacing:0.5px; width:fit-content;
    display:flex; align-items:center; gap:12px;
  }

  .footer{display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:36px;}
  .handle{font-family:'Space Mono'; font-size:22px; color:var(--off-white); font-weight:700; letter-spacing:0.3px;}
  .url{font-family:'Space Mono'; font-size:20px; color:var(--gray); letter-spacing:0.3px;}
  .dots{display:flex; gap:9px; flex-wrap:wrap; max-width:360px; justify-content:flex-end;}
  .dots .dot{width:8px; height:8px; border-radius:50%; background:var(--navy-line);}
  .dots .dot.active{background:var(--orange); width:22px; border-radius:5px;}
</style>
</head>
<body>
<div class="post" id="post">
  <div class="bg" id="bg" style="display:none;"><img id="bgImg" src="" alt=""></div>
  <div class="wm" id="wm" style="display:none;"></div>
  <div class="content" id="content"></div>
</div>

<script>
const SPORT_BRANCHES = [
  {
    key: "moto", name: "Motošport",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/><line x1="12" y1="4" x2="12" y2="10"/><line x1="6" y1="16" x2="10" y2="13"/><line x1="18" y1="16" x2="14" y2="13"/></svg>',
    body: "Piloti F1 a WRC musia pri rýchlosti nad <strong>300 km/h</strong> vyhodnotiť situáciu v zlomkoch sekundy. Tímy dnes bežne trénujú reakčný čas a periférne videnie svojich jazdcov."
  },
  {
    key: "futbal", name: "Futbal",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8.3l2.7 2-1 3.2h-3.4l-1-3.2z" fill="currentColor"/><path d="M12 3.5v2.7M6.3 7.3l2.2 1.7M17.7 7.3l-2.2 1.7M8.6 16.7l1-3.2M15.4 16.7l-1-3.2" stroke-width="1.3"/></svg>',
    body: "Štúdia <strong>J. Fauberta</strong> (2013) ukázala, že profesionálni futbalisti sa učia sledovať viacero objektov naraz rýchlejšie než bežná populácia. Podobne trénovala aj olympijská brankárka <strong>Erin McLeod</strong>."
  },
  {
    key: "basketbal", name: "Basketbal (NBA)",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="3" x2="12" y2="21"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M5.5 5.5C8 8.5 8 15.5 5.5 18.5"/><path d="M18.5 5.5C16 8.5 16 15.5 18.5 18.5"/></svg>',
    body: "So zrakovým tréningom experimentovali <strong>Stephen Curry</strong> a Kawhi Leonard. Kluby v NBA, napríklad Toronto Raptors, naň bežne používajú NeuroTracker."
  },
  {
    key: "nfl", name: "Americký futbal (NFL)",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12c0-3.5 4-7.5 8-7.5s8 4 8 7.5-4 7.5-8 7.5-8-4-8-7.5z"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="9.5" y1="10" x2="9.5" y2="14"/><line x1="12" y1="9.3" x2="12" y2="14.7"/><line x1="14.5" y1="10" x2="14.5" y2="14"/></svg>',
    body: "Bývalý MVP <strong>Matt Ryan</strong> trénuje s NeuroTracker celoročne. Tímy v NFL bežne testujú hráčov aj na zariadeniach typu Dynavision."
  },
  {
    key: "combat", name: "Bojové športy a šerm",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="5" y1="20" x2="19" y2="4"/><line x1="19" y1="20" x2="5" y2="4"/><line x1="8" y1="16.5" x2="10.5" y2="18.3"/><line x1="16" y1="16.5" x2="13.5" y2="18.3"/><circle cx="5" cy="20" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="20" r="1" fill="currentColor" stroke="none"/></svg>',
    body: "Rozlíšenie skutočného útoku od finty súpera padá v <strong>desiatkach milisekúnd</strong> — presne to, čo meria kognitívna kontrola."
  }
];

const DOMAINS = [
  {
    key: "esports", name: "Esports",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="8" width="18" height="9" rx="4"/><circle cx="8" cy="12.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="12.5" r="1.3" fill="currentColor" stroke="none"/></svg>',
    body: "Profesionálni hráči dosahujú reakčné časy okolo <strong>150–200 ms</strong>, hlboko pod bežným priemerom populácie."
  },
  {
    key: "aviation", name: "Letectvo",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 21 4 13 21 11 13 3 12z"/></svg>',
    body: "Výber aj výcvik pilotov bežne zahŕňa testy typu <strong>Useful Field of View</strong> — situačné povedomie je tu otázkou bezpečnosti."
  },
  {
    key: "surgery", name: "Chirurgia",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="7" x2="12" y2="17"/><line x1="7" y1="12" x2="17" y2="12"/></svg>',
    body: "Výskum (<strong>Grantcharov a kol.</strong>) ukázal, že vizuopriestorová schopnosť predikuje výkon v laparoskopickej chirurgii."
  },
  {
    key: "road", name: "Bezpečnosť cestnej premávky",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/><line x1="12" y1="4" x2="12" y2="10"/><line x1="6" y1="16" x2="10" y2="13"/><line x1="18" y1="16" x2="14" y2="13"/></svg>',
    body: "<strong>UFOV</strong> patrí medzi najsilnejšie prediktory rizika nehody — v USA je súčasťou hodnotenia spôsobilosti viesť vozidlo u starších vodičov."
  },
  {
    key: "gaming", name: "Herný výskum",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><line x1="8" y1="20" x2="16" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/></svg>',
    body: "Klasická štúdia <strong>Green &amp; Bavelier</strong> (2003) ukázala, že hráči akčných videohier majú rozšírené zorné pole a rýchlejšie spracovanie vizuálnych podnetov."
  }
];

const SLIDES = [
  { type: "cover" },
  { type: "sport-intro" },
  ...SPORT_BRANCHES.map(d => ({ type: "sport-fact", d })),
  ...DOMAINS.map(d => ({ type: "fact", d })),
  { type: "cta" }
];
const TOTAL = SLIDES.length;

function dotsHtml(n){
  let h = '<div class="dots">';
  for (let i=0;i<TOTAL;i++) h += `<div class="dot${i===n?' active':''}"></div>`;
  h += '</div>';
  return h;
}

function render(i){
  const s = SLIDES[i];
  const eyebrowText = s.type === 'sport-intro' || s.type === 'sport-fact' ? 'Šport' : 'V praxi';
  const eyebrow = `<span class="eyebrow">${eyebrowText}</span>`;
  const counter = `<span class="counter">${i+1}<span>/${TOTAL}</span></span>`;
  document.getElementById('bg').style.display = 'none';
  document.getElementById('wm').style.display = 'none';

  let body = '';
  if (s.type === 'cover') {
    document.getElementById('bg').style.display = 'block';
    document.getElementById('bgImg').src = 'assets/athlete-homola.jpg';
    body = `
      <div class="top-bar">${eyebrow}${counter}</div>
      <div class="spacer"></div>
      <div class="cover-cat">Kde sa to reálne využíva</div>
      <div class="cover-hook">Vizuálny a kognitívny tréning nie je marketingový pojem — vo svete sa bežne používa naprieč športom, bezpečnosťou aj medicínou.</div>
      <div class="swipe-hint">${TOTAL - 2} oblastí →</div>
      <div class="footer">
        <span class="handle">@the.focus.place</span>
        ${dotsHtml(i)}
      </div>`;
  } else if (s.type === 'sport-intro') {
    document.getElementById('bg').style.display = 'block';
    document.getElementById('bgImg').src = 'assets/athlete-duduc.jpg';
    body = `
      <div class="top-bar">${eyebrow}${counter}</div>
      <div class="spacer"></div>
      <div class="cover-cat">Šport</div>
      <div class="cover-hook">Od volantu po ihrisko — periférne videnie a rýchle rozhodovanie rozhodujú takmer v každom športe.</div>
      <div class="swipe-hint">${SPORT_BRANCHES.length} odvetvia →</div>
      <div class="footer">
        <span class="handle">@the.focus.place</span>
        ${dotsHtml(i)}
      </div>`;
  } else if (s.type === 'fact' || s.type === 'sport-fact') {
    const wm = document.getElementById('wm');
    wm.style.display = 'block';
    wm.style.right = '-60px';
    wm.style.bottom = '-60px';
    wm.style.width = '520px';
    wm.style.height = '520px';
    wm.innerHTML = s.d.icon;
    body = `
      <div class="top-bar">${eyebrow}${counter}</div>
      <div class="spacer"></div>
      <div class="icon-badge">${s.d.icon}</div>
      <div class="fact-label">${s.d.name}</div>
      <div class="fact-body">${s.d.body}</div>
      <div class="footer">
        <span class="handle">@the.focus.place</span>
        ${dotsHtml(i)}
      </div>`;
  } else {
    body = `
      <div class="top-bar">${eyebrow}${counter}</div>
      <div class="spacer"></div>
      <div class="cta-wrap">
        <div class="cta-eyebrow">Otestuj sa</div>
        <div class="cta-headline">Zisti, ako na tom<br>si ty.</div>
        <div class="cta-body">20+ live testov reakčného času, pamäte, koordinácie a pozornosti — zadarmo, priamo v prehliadači.</div>
        <div class="cta-btn">Skús na focusplace.site →</div>
      </div>
      <div class="footer">
        <span class="url">FOCUSPLACE.SITE</span>
        ${dotsHtml(i)}
      </div>`;
  }
  document.getElementById('content').innerHTML = body;
}

const params = new URLSearchParams(location.search);
const i = parseInt(params.get('i') || '0', 10);
render(i);
window.TOTAL_SLIDES = TOTAL;
</script>
</body>
</html>
