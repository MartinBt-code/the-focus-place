<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#11181D; --navy-line:#2B333C; --orange:#FEC62F; --off-white:#F2F0EB; --gray:#8891A0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{width:1080px; height:1080px; overflow:hidden; font-family:'Inter',sans-serif; background:var(--navy);}
  .poster{position:relative; width:1080px; height:1080px; background:var(--navy); overflow:hidden;}

  .bgtext{
    position:absolute; inset:0; z-index:0; overflow:hidden;
    font-family:'Anton'; color:var(--navy-line); font-size:150px; text-transform:uppercase;
    line-height:1; letter-spacing:2px; opacity:0.45; white-space:nowrap;
  }
  .bgtext div{transform:rotate(-8deg); position:absolute; left:-15%; width:140%; text-align:center;}

  .icon{position:absolute; right:-90px; bottom:-90px; width:520px; height:520px; opacity:0.08; z-index:0;}

  .content{position:relative; z-index:2; padding:84px 84px; height:100%; display:flex; flex-direction:column;}
  .eyebrow{
    font-family:'Space Mono'; font-weight:700; font-size:22px; color:var(--navy);
    background:var(--off-white); display:inline-block; padding:8px 18px; letter-spacing:1.5px;
    text-transform:uppercase; width:fit-content;
  }
  h1{
    font-family:'Anton'; color:var(--off-white); font-size:72px;
    line-height:1.12; margin-top:28px; letter-spacing:0.5px;
  }
  h1 em{font-style:normal; color:var(--navy); background:var(--orange); padding:0 8px; display:inline;}
  .spacer{flex:1;}
  .lead{
    font-size:24px; color:var(--gray); line-height:1.55; max-width:720px; margin-bottom:8px;
  }
  .lead strong{color:var(--off-white); font-weight:600;}
  .footer{display:flex; align-items:center; justify-content:space-between; margin-top:36px;}
  .footer img{height:42px; width:auto;}
  .footer .url{font-family:'Space Mono'; font-size:20px; color:var(--orange); font-weight:700; letter-spacing:0.5px;}
</style>
</head>
<body>
<div class="poster">
  <div class="bgtext">
    <div style="top:40px;">FOCUS PLACE FOCUS PLACE</div>
    <div style="top:280px;">FOCUS PLACE FOCUS PLACE</div>
    <div style="top:520px;">FOCUS PLACE FOCUS PLACE</div>
    <div style="top:760px;">FOCUS PLACE FOCUS PLACE</div>
    <div style="top:1000px;">FOCUS PLACE FOCUS PLACE</div>
  </div>
  <img class="icon" src="assets/thePlace_icon_white.png" alt="">
  <div class="content">
    <span class="eyebrow">O vizuálnom tréningu</span>
    <h1>VÄČŠINA ŠPORTOVCOV<br>TRÉNUJE TELO.<br>LEN MÁLOKTO<br>TRÉNUJE <em>OČI</em>.</h1>
    <div class="spacer"></div>
    <div class="footer">
      <img src="assets/thePlace_logo_white.png" alt="the Focus Place">
      <span class="url">FOCUSPLACE.SITE</span>
    </div>
  </div>
</div>
</body>
</html>
