<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#11181D; --navy-line:#2B333C; --orange:#FEC62F; --off-white:#F2F0EB; --gray:#8891A0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{width:1080px; height:1080px; overflow:hidden; font-family:'Inter',sans-serif; background:var(--navy);}
  .post{position:relative; width:1080px; height:1080px; background:var(--navy); overflow:hidden;}

  .content{position:relative; z-index:2; height:100%; display:flex; flex-direction:column; padding:56px 64px;}

  .top-bar{display:flex; align-items:center; justify-content:space-between;}
  .eyebrow{
    font-family:'Space Mono'; font-weight:700; font-size:22px; color:var(--navy);
    background:var(--orange); display:inline-block; padding:8px 16px; letter-spacing:1.5px;
    text-transform:uppercase; width:fit-content; border-radius:3px;
  }
  .top-bar img{height:36px; width:auto;}

  .photo-strip{
    position:relative; width:100%; height:520px; margin-top:32px;
    border-radius:8px; overflow:hidden; background:#1A2029;
  }
  .photo-strip img{
    width:100%; height:100%; object-fit:cover; object-position:50% 50%;
  }

  .spacer{flex:1;}

  .caption{
    font-family:'Anton'; color:var(--off-white); font-size:60px;
    line-height:1.1; letter-spacing:0.3px; margin-bottom:14px;
  }
  .caption em{font-style:normal; color:var(--orange);}

  .footer{display:flex; align-items:center; justify-content:space-between; margin-top:24px;}
  .footer .handle{font-family:'Space Mono'; font-size:22px; color:var(--off-white); font-weight:700; letter-spacing:0.3px;}
  .footer .url{font-family:'Space Mono'; font-size:20px; color:var(--gray); letter-spacing:0.3px;}
</style>
</head>
<body>
<div class="post">
  <div class="content">
    <div class="top-bar">
      <span class="eyebrow">Focus in motion</span>
      <img src="assets/thePlace_icon_white.png" alt="">
    </div>

    <div class="photo-strip">
      <img src="assets/workshop/martin-7-dark.jpg" alt="">
    </div>

    <div class="spacer"></div>

    <div class="caption">Thumbs up<br>for <em>visual training</em>.</div>

    <div class="footer">
      <span class="handle">@the.focus.place</span>
      <span class="url">FOCUSPLACE.SITE</span>
    </div>
  </div>
</div>
</body>
</html>
