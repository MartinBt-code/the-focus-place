<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#11181D; --navy-line:#2B333C; --orange:#FEC62F; --off-white:#F2F0EB; --gray:#8891A0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{width:1080px; height:1080px; overflow:hidden; font-family:'Inter',sans-serif; background:var(--navy);}
  .poster{position:relative; width:1080px; height:1080px; background:var(--navy); overflow:hidden;}

  .bg{position:absolute; inset:0; z-index:0; overflow:hidden;}
  .bg img{
    width:100%; height:100%; object-fit:cover; object-position:60% 35%;
    filter:grayscale(1) brightness(0.55) contrast(1.05);
    opacity:0.4;
  }
  .bg .fade{
    position:absolute; inset:0;
    background:linear-gradient(245deg, var(--navy) 0%, var(--navy) 42%, rgba(17,24,29,0.55) 68%, rgba(17,24,29,0.25) 100%);
  }

  .icon{position:absolute; left:-100px; top:-100px; width:480px; height:480px; opacity:0.08; z-index:0;}

  .content{position:relative; z-index:2; padding:84px; height:100%; display:flex; flex-direction:column; justify-content:center;}
  .eyebrow{
    font-family:'Space Mono'; font-weight:700; font-size:22px; color:var(--navy);
    background:var(--off-white); display:inline-block; padding:8px 18px; letter-spacing:1.5px;
    text-transform:uppercase; width:fit-content; margin-bottom:44px;
  }
  .body-text{
    font-family:'Anton'; text-transform:uppercase; color:var(--off-white); font-size:46px;
    line-height:1.32; letter-spacing:0.3px;
  }
  .body-text em{font-style:normal; color:var(--navy); background:var(--orange); padding:0 6px; display:inline;}
  .footer{display:flex; align-items:center; justify-content:space-between; margin-top:56px;}
  .footer img{height:42px; width:auto;}
  .footer .url{font-family:'Space Mono'; font-size:20px; color:var(--orange); font-weight:700; letter-spacing:0.5px;}
</style>
</head>
<body>
<div class="poster">
  <div class="bg">
    <img src="assets/workshop/bg-photo-2.webp" alt="">
    <div class="fade"></div>
  </div>
  <img class="icon" src="assets/thePlace_icon_white.png" alt="">
  <div class="content">
    <span class="eyebrow">O vizuálnom tréningu</span>
    <p class="body-text">Skôr než sa pohneš, musíš vidieť. <em>Vizuálny systém</em> vedie každé rozhodnutie na ihrisku — a presne tak ako sila alebo rýchlosť, aj vizuálny systém sa dá trénovať.</p>
    <div class="footer">
      <img src="assets/thePlace_logo_white.png" alt="the Focus Place">
      <span class="url">FOCUSPLACE.SITE</span>
    </div>
  </div>
</div>
</body>
</html>
